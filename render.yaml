services:
  - type: web
    name: alfa-respuestas
    env: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: oregon
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
    disk:
      name: alfa-data
      mountPath: /data
      sizeGB: 1
